        <script>try{if(localStorage.getItem("cgx-theme")==="light"){document.documentElement.classList.add("light")}}catch(e){}</script>
        <script>
            // Decode GitHub Pages SPA redirects (paired with public/404.html)
            (function (l) {
                if (l.search[1] === "/") {
                    var decoded = l.search.slice(1).split("&").map(function (s) { return s.replace(/~and~/g, "&"); }).join("?");
                    window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
                }
            })(window.location);
        </script>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
    </head>
