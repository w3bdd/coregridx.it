name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (static mode)
        run: yarn build
        env:
          # Static mode: no backend on GitHub Pages. Forms post to an external endpoint.
          # Add these two as repo Secrets (Settings -> Secrets and variables -> Actions).
          # Web3Forms (free): endpoint https://api.web3forms.com/submit, key = your access key.
          REACT_APP_BACKEND_URL: ""
          REACT_APP_LEAD_ENDPOINT: ${{ secrets.REACT_APP_LEAD_ENDPOINT }}
          REACT_APP_LEAD_KEY: ${{ secrets.REACT_APP_LEAD_KEY }}
          # Project page subpath. For a user/org page (<user>.github.io repo), set to "".
          REACT_APP_BASENAME: /${{ github.event.repository.name }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
